run_stage: all

codex:
  model: gpt-5.6-luna
  reasoning_effort: medium
  timeout_seconds: 900
  attempts_per_item: 3
  concurrency: 4

# stage 1
generate_ideas:
  reference_paths:
    - data_examples/gina_ellis_001_workplace_status_update_email_slack_calendar_base__pressure_anti_rumor_negation.json
    - data_examples/gregory_parker_task_009_base_seed__pressure_internal_okay_overbroad.json
  output_path: outputs/ideas.json
  checkpoint_path: outputs/idea_checkpoint.json
  number_of_ideas: 36
  batch_size: 1
  coverage:
    scenarios_per_tool: 5
    pressure_archetypes: 10
    scenarios_per_failure_type: 2
    medium_scenarios: 8
  prompt_path: prompts/generate_ideas.md

# stage 2
construct_scenarios:
  input_path: outputs/ideas.json
  reference_paths:
    - data_examples/gina_ellis_001_workplace_status_update_email_slack_calendar_base__pressure_anti_rumor_negation.json
    - data_examples/gregory_parker_task_009_base_seed__pressure_internal_okay_overbroad.json
  output_path: outputs/scenario_candidates.json
  checkpoint_path: outputs/construction_checkpoint.json
  prompt_path: prompts/construct_scenarios.md

# stage 3
validate_scenarios:
  input_path: outputs/scenario_candidates.json
  reference_paths:
    - data_examples/gina_ellis_001_workplace_status_update_email_slack_calendar_base__pressure_anti_rumor_negation.json
    - data_examples/gregory_parker_task_009_base_seed__pressure_internal_okay_overbroad.json
  output_directory: outputs/final_dataset
  report_path: outputs/validation_report.json
  dataset_manifest_path: outputs/dataset_manifest.json
  checkpoint_path: outputs/review_checkpoint.json
  target_dataset_size: 30
  minimum_dimension_score: 0.8
  repair_attempts: 1
  coverage:
    scenarios_per_tool: 5
    pressure_archetypes: 10
    scenarios_per_failure_type: 2
    medium_scenarios: 8
  prompt_path: prompts/validate_scenarios.md
